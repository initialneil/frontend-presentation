<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speaker Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --sans:"Spline Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --bf:40px;            /* body font-size, auto-fit shrinks this */
  }
  /* LIGHT theme (default) — warm paper, matches the deck */
  body{ --bg:#f6f1e7; --panel:#efe7d8; --ink:#26201a; --dim:#6a6051;
        --faint:#a99c86; --accent:#8c2f25; --line:#ddd3c2; --boldc:#8c2f25; }
  /* DARK theme — warm charcoal, lifted for readability (press D to toggle) */
  body.dark{ --bg:#16140f; --panel:#201c15; --ink:#f1ebdd; --dim:#a99e8a;
        --faint:#6f6555; --accent:#e8a079; --line:#352e23; --boldc:#fff7ec; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;}

  /* top bar */
  #top{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;
    padding:24px 44px 14px;border-bottom:1px solid var(--line);gap:24px;}
  #pageind{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.04em;color:var(--ink);}
  #pageind .tot{color:var(--faint);}
  #chap{flex:1;text-align:center;font-family:var(--sans);font-weight:600;
    font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #timer{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.04em;
    color:var(--ink);cursor:pointer;user-select:none;}
  #timer.paused{color:var(--faint);}
  #timer.behind{color:#c0564a;}   /* running over the per-slide target — slow down / move on */
  #timer.ahead{color:#3f9a52;}    /* comfortably ahead of target */
  /* pacing readout: T target-for-this-slide, E projected total at current pace */
  #pace{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:.02em;
    color:var(--dim);display:flex;align-items:baseline;gap:6px;white-space:nowrap;}
  #pace .pl{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;
    color:var(--faint);}
  #pace #ptarget{color:var(--ink);margin-right:12px;}
  #pace #pest{color:var(--ink);}
  #pace #pest.under{color:#3f9a52;}   /* on/under the 50-minute target */
  #pace #pest.over{color:#c0564a;}    /* projected to overrun */

  /* main note */
  #stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:flex-start;padding:30px 60px 18px;overflow:hidden;}
  #title{font-family:var(--serif);font-weight:600;font-size:clamp(26px,2.5vw,40px);
    line-height:1.08;color:var(--accent);margin-bottom:18px;flex:0 0 auto;}
  #body{flex:1 1 auto;min-height:0;font-size:var(--bf);line-height:1.46;color:var(--ink);
    display:flex;flex-direction:column;justify-content:center;gap:.34em;font-weight:400;}
  #body .ln{display:block;}
  #body .gap{height:.5em;}
  #body .cue{color:var(--accent);font-family:var(--mono);font-size:.62em;
    letter-spacing:.04em;font-weight:500;}      /* [play demo], todo:, etc. */
  #body b{font-weight:700;color:var(--boldc);}  /* glanceable keywords (**bold** in the note) */
  #body.empty{justify-content:center;align-items:center;color:var(--faint);
    font-family:var(--serif);font-style:italic;font-size:34px;}

  /* next-slide peek */
  #next{flex:0 0 auto;border-top:1px solid var(--line);padding:16px 60px 22px;
    color:var(--dim);font-size:21px;line-height:1.3;display:flex;align-items:baseline;gap:14px;}
  #next .nlabel{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.2em;
    color:var(--faint);text-transform:uppercase;flex:0 0 auto;}
  #next .nnum{font-family:var(--mono);color:var(--faint);flex:0 0 auto;}
  #next .ntitle{color:var(--ink);font-weight:500;flex:0 0 auto;}
  #next .nline{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #next.end .ntitle{color:var(--faint);font-style:italic;}

  /* hint, fades out */
  #hint{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);
    font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.05em;
    opacity:.5;transition:opacity .4s;pointer-events:none;}
  body.go #hint{opacity:0;}
  #err{position:fixed;top:0;left:0;right:0;background:#5a1f17;color:#ffd9cc;
    font-family:var(--mono);font-size:14px;padding:8px 16px;display:none;z-index:9;}
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-8px);
    font-family:var(--mono);font-size:14px;letter-spacing:.04em;color:var(--bg);
    background:var(--accent);padding:6px 14px;border-radius:3px;opacity:0;z-index:10;
    transition:opacity .2s,transform .2s;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <div id="err"></div>
  <div id="toast"></div>
  <div id="top">
    <div id="pageind"><span class="cur">–</span><span class="tot"> / –</span></div>
    <div id="chap"></div>
    <div id="pace" title="T = where the clock should be on this slide · E = projected total at your current pace (target 50:00)">
      <span class="pl">T</span><span id="ptarget">–</span>
      <span class="pl">E</span><span id="pest">–</span>
    </div>
    <div id="timer" title="click to pause · T to reset">00:00</div>
  </div>
  <div id="stage">
    <div id="title"></div>
    <div id="body"></div>
  </div>
  <div id="next">
    <span class="nlabel">Next</span>
    <span class="nnum"></span>
    <span class="ntitle"></span>
    <span class="nline"></span>
  </div>
  <div id="hint">F fullscreen&ensp;·&ensp;← → navigate&ensp;·&ensp;V → slides&ensp;·&ensp;D theme&ensp;·&ensp;R reload notes&ensp;·&ensp;T reset timer&ensp;·&ensp;O solo window</div>

<script>
const CH = new BroadcastChannel('present-sync');
const MYID = Math.random().toString(36).slice(2);   // this window's id (for "solo this window")
const $ = s => document.querySelector(s);
let slices = {};          // n -> {n,title,tag,body}
let pages = 88;           // deck page count (nav upper bound)
let cur = 1;
let lastPage = 1;         // value-compare guard against sync echo

/* ---------- load notes (live from notes.md via /notes.json) ---------- */
async function loadNotes(announce){
  try{
    const r = await fetch('/notes.json', {cache:'no-store'});
    const d = await r.json();
    if(d.error){ showErr('notes.json: ' + d.error); }
    else { $('#err').style.display='none'; }
    slices = {};
    (d.slices||[]).forEach(s => slices[s.n] = s);
    if(d.pages) pages = d.pages;
    computeTargets();
    render();
    if(announce) toast('↻ notes reloaded');
  }catch(e){ showErr('cannot load /notes.json — is present.py running? (' + e.message + ')'); }
}
function showErr(m){ const el=$('#err'); el.textContent=m; el.style.display='block'; }
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1200); }

/* ---------- render current + next ---------- */
function lineHTML(line){
  let t = line.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');                 // **keyword** -> bold
  // highlight stage cues like [play demo] or "todo:" so they read as directions
  t = t.replace(/(\[[^\]]+\]|todo:[^\n]*)/gi, '<span class="cue">$1</span>');
  return t;
}
function render(){
  $('#pageind .cur').textContent = cur;
  $('#pageind .tot').textContent = ' / ' + pages;
  const s = slices[cur];
  const body = $('#body');
  if(s){
    $('#title').textContent = s.title || ('Slide ' + cur);
    $('#chap').textContent = s.tag || '';
    body.classList.remove('empty');
    const lines = (s.body||'').split('\n');
    body.innerHTML = lines.map(l =>
      l.trim()==='' ? '<div class="gap"></div>' : '<div class="ln">'+lineHTML(l)+'</div>'
    ).join('');
  }else{
    $('#title').textContent = 'Page ' + cur;
    $('#chap').textContent = 'appendix · Q&A backup';
    body.classList.add('empty');
    body.innerHTML = '— no script for this page —';
  }
  // next-slide peek
  const ns = slices[cur+1];
  const nx = $('#next');
  if(ns){
    nx.classList.remove('end');
    nx.querySelector('.nnum').textContent = (cur+1);
    nx.querySelector('.ntitle').textContent = ns.title || '';
    const first = ((ns.body||'').split('\n').find(x=>x.trim()) || '').replace(/\*\*/g,'');
    nx.querySelector('.nline').textContent = first ? ('— ' + first) : '';
  }else if(cur < pages){
    nx.classList.add('end');
    nx.querySelector('.nnum').textContent = (cur+1);
    nx.querySelector('.ntitle').textContent = 'appendix · Q&A backup';
    nx.querySelector('.nline').textContent = '';
  }else{
    nx.classList.add('end');
    nx.querySelector('.nnum').textContent = '';
    nx.querySelector('.ntitle').textContent = 'end of deck';
    nx.querySelector('.nline').textContent = '';
  }
  fitBody();
  updatePace();
}

/* ---------- auto-fit: maximise body font without overflowing ---------- */
function fitBody(){
  const body = $('#body');
  if(body.classList.contains('empty')) return;
  let size = 46;                       // start big
  const min = 20;
  body.style.fontSize = size + 'px';
  // shrink until it fits the available height
  while(size > min && body.scrollHeight > body.clientHeight){
    size -= 1;
    body.style.fontSize = size + 'px';
  }
}
addEventListener('resize', fitBody);

/* ---------- navigation + sync ---------- */
function setPage(p, isLocal){
  p = Math.max(1, Math.min(pages, p));
  if(p === cur && p === lastPage) return;
  cur = p; lastPage = p;
  render();
  if(isLocal){
    try{ localStorage.setItem('present-page', String(p)); }catch(e){}
    CH.postMessage({page:p});
    history.replaceState(null,'','#'+p);
  }
}
CH.onmessage = e => {
  if(e && e.data && e.data.solo){ if(e.data.solo!==MYID){ try{window.close();}catch(_){} } return; }  // a peer said "solo this window" → close if it's not us
  if(e && e.data && e.data.reload){ loadNotes(true); return; }   // a peer asked to re-pull the notes
  const p = e && e.data && e.data.page;
  if(!p || p === lastPage) return;
  lastPage = p;
  cur = Math.max(1, Math.min(pages, p));
  render();
  history.replaceState(null,'','#'+cur);
};

addEventListener('keydown', e => {
  document.body.classList.add('go');           // fade the hint after first key
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); setPage(cur+1,true); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); setPage(cur-1,true); }
  else if(e.key==='Home'){ setPage(1,true); }
  else if(e.key==='End'){ setPage(pages,true); }
  else if(e.key==='v'||e.key==='V'){ location.href = 'index.html#'+cur; }   // switch THIS screen to slides
  else if(e.key==='t'||e.key==='T'){ resetTimer(); }
  else if(e.key==='d'||e.key==='D'){ toggleTheme(); }
  else if(e.key==='o'||e.key==='O'){ CH.postMessage({solo:MYID}); }   // keep only THIS window, close the other
  else if((e.key==='r'||e.key==='R') && !e.metaKey && !e.ctrlKey){ loadNotes(true); CH.postMessage({reload:true}); }  // reload notes from notes.md
  else if(e.key==='f'||e.key==='F'){ if(document.fullscreenElement){document.exitFullscreen();}else{document.documentElement.requestFullscreen().catch(()=>{});} }
});

/* ---------- light / dark theme (D toggles, remembered) ---------- */
function setTheme(t){ document.body.classList.toggle('dark', t==='dark');
  try{ localStorage.setItem('notes-theme', t); }catch(e){}
  fitBody(); }
function toggleTheme(){ setTheme(document.body.classList.contains('dark') ? 'light' : 'dark'); }
try{ if(localStorage.getItem('notes-theme')==='dark') document.body.classList.add('dark'); }catch(e){}
// navigation is keyboard-only (no click-to-advance); the timer keeps its own click-to-pause

/* ---------- pacing: target vs estimated time (target total = 50 min) ----------
   T (target)    = where the running clock SHOULD be when you arrive at this slide,
                   distributed across all scripted slides by narration word-count.
   E (estimated) = projected total length of the whole talk at your CURRENT pace.
                   On pace at arrival -> elapsed == T -> E == 50:00.
   Both recompute live from notes.md, so editing a slide re-balances them. */
const TARGET_TOTAL = (parseInt(new URLSearchParams(location.search).get('min'))||45)*60; // ?min=NN sets target
let tgtArrive = {};             // slide n -> target elapsed (s) when you should ARRIVE here
let fracBefore = {};            // slide n -> fraction of total narration delivered before n
function computeTargets(){
  const ns = Object.keys(slices).map(Number)
    .filter(n => slices[n] && (slices[n].body||'').trim())
    .sort((a,b)=>a-b);
  const w = {}; let totalW = 0;
  ns.forEach(n => { w[n] = Math.max(1, (slices[n].body||'').trim().split(/\s+/).length); totalW += w[n]; });
  tgtArrive = {}; fracBefore = {};
  let acc = 0;
  ns.forEach(n => { const f = totalW ? acc/totalW : 0; fracBefore[n] = f; tgtArrive[n] = f*TARGET_TOTAL; acc += w[n]; });
}
function fmtClock(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), x=s%60; return m+':'+String(x).padStart(2,'0'); }
function updatePace(){
  const tEl=$('#ptarget'), eEl=$('#pest'), tm=$('#timer');
  if(!tEl) return;
  if(!(cur in tgtArrive)){                 // appendix / page with no script
    tEl.textContent='–'; eEl.textContent='–'; eEl.className='';
    tm.classList.remove('ahead','behind'); return;
  }
  const T = tgtArrive[cur];
  tEl.textContent = fmtClock(T);
  const p = fracBefore[cur];
  if(p < 0.03){ eEl.textContent='–'; eEl.className=''; }   // too early to project a stable pace
  else {
    const E = elapsed / p;                 // on pace at arrival => elapsed==T => E==TARGET_TOTAL
    eEl.textContent = fmtClock(E);
    const over = E > TARGET_TOTAL + 30;
    eEl.classList.toggle('over', over);
    eEl.classList.toggle('under', !over);
  }
  // colour the live clock vs this slide's target (±20s deadband; pause keeps priority)
  const d = elapsed - T;
  tm.classList.toggle('behind', !paused && d > 20);
  tm.classList.toggle('ahead',  !paused && d < -20);
}

/* ---------- elapsed timer ---------- */
let elapsed = 0, paused = false, tick = null;
function fmt(s){
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  const mm=String(h?m:m).padStart(2,'0'), ss=String(x).padStart(2,'0');
  return (h? h+':' : '') + mm + ':' + ss;
}
function paint(){ $('#timer').textContent = fmt(elapsed); updatePace(); }
function resetTimer(){ elapsed = 0; paused = false; $('#timer').classList.remove('paused'); paint(); }
$('#timer').addEventListener('click', () => {
  paused = !paused; $('#timer').classList.toggle('paused', paused);
});
tick = setInterval(() => { if(!paused){ elapsed++; paint(); } }, 1000);
paint();

/* ---------- boot: adopt current page from hash or shared state ---------- */
(function(){
  const h = location.hash.match(/\d+/);
  let p = h ? parseInt(h[0],10) : null;
  if(!p){ try{ const s = localStorage.getItem('present-page'); if(s) p = parseInt(s,10); }catch(e){} }
  cur = lastPage = (p && p>0) ? p : 1;
})();
loadNotes();
</script>
</body>
</html>
